[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "barforge"
version = "1.1.0"
description = "Paired clean/control manga dataset editor for AI-Toolkit"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "Pillow>=10.4,<13",
    "opencv-python>=4.10,<6",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "keyring>=25,<27",
    "onnxruntime>=1.20,<2",
]

[project.scripts]
barforge = "barforge.app:main"

[tool.setuptools.packages.find]
include = ["barforge*"]

[tool.setuptools.package-data]
barforge = ["assets/*.onnx", "assets/*.json", "assets/*LICENSE.txt", "locales/*.json"]
